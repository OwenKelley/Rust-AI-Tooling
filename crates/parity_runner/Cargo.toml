[package]
name = "parity_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs rnumpy/rscipy/rpandas/RusTorch ops and emits JSON timings/checksums for Python comparison"

[[bin]]
name = "parity_runner"
path = "src/main.rs"

[[bin]]
name = "scipy_parity_runner"
path = "src/scipy_main.rs"

[[bin]]
name = "pandas_parity_runner"
path = "src/pandas_main.rs"

[[bin]]
name = "torch_parity_runner"
path = "src/torch_main.rs"

[dependencies]
rnumpy = { path = "../rnumpy" }
rscipy = { path = "../rscipy" }
rpandas = { path = "../rpandas" }
rustorch = { path = "../rustorch" }
