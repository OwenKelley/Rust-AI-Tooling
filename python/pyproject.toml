[project]
name = "rust-ai-tooling-python"
version = "0.1.0"
description = "Python reference side for Rust AI tooling parity tests"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.0",
    "pyarrow>=14.0",
    "polars>=1.0",
    "scikit-learn>=1.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core_numerical"]
