[workspace]
resolver = "2"
members = [
    "crates/rnumpy",
    "crates/parity_runner",
]
default-members = ["crates/rnumpy", "crates/parity_runner"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ndarray = { version = "0.16", features = ["matrixmultiply-threading", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
approx = "0.5"
criterion = "0.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
